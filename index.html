<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0b09" />
  <title>你，不止一个人 · 秦的终章</title>
  <meta name="description" content="课程终章互动：那些你以为由一个人完成的事，其实是秦国五位君主接力的三百年。" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#reveal">跳到终章</a>

  <div class="ambient" aria-hidden="true">
    <span class="ambient-glow ambient-glow--one"></span>
    <span class="ambient-glow ambient-glow--two"></span>
    <span class="ambient-grid"></span>
    <span class="ambient-qin">秦</span>
    <span class="ambient-dust" id="dust"></span>
  </div>

  <div class="grain" aria-hidden="true"></div>

  <header class="masthead">
    <div class="wordmark" aria-label="秦 · 终章">
      <span class="wordmark-seal" aria-hidden="true">秦</span>
      <span class="wordmark-text">终章<small>THE LAST CHAPTER</small></span>
    </div>
    <p class="masthead-meta">
      <span>课程终章</span>
      <span class="meta-rule" aria-hidden="true"></span>
      <span>约前 890 — 前 604</span>
    </p>
  </header>

  <!-- 课程动画落点：内心独白 -->
  <section class="prologue" id="prologue" aria-labelledby="os-line">
    <div class="prologue-columns" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="prologue-inner">
      <p class="prologue-tag"><span class="tag-dot" aria-hidden="true"></span>内心 OS</p>
      <blockquote class="os" id="os-line">
        <span class="os-line">“所以这一次，</span>
        <span class="os-line">我到底是谁呢？”</span>
        <span class="os-caret" aria-hidden="true"></span>
      </blockquote>
      <div class="prologue-foot">
        <button class="enter-button" id="enter-button" type="button">
          <span>照见来路</span>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4v15M6 13l6 6 6-6" /></svg>
        </button>
        <p class="prologue-note">片刻之后，自动继续</p>
      </div>
    </div>

    <p class="prologue-side" aria-hidden="true">我 是 谁</p>
  </section>

  <main class="reveal" id="reveal" aria-labelledby="thesis-title" aria-hidden="true">
    <h1 class="sr-only" id="thesis-title" tabindex="-1">你，不止一个人</h1>

    <section class="gallery-section" aria-label="秦国五位君主">
      <div class="rail-wrap">
        <div class="rail" id="rail" role="group" aria-label="秦国五位君主立绘"></div>
        <div class="rail-edge rail-edge--left" aria-hidden="true"></div>
        <div class="rail-edge rail-edge--right" aria-hidden="true"></div>
      </div>
    </section>
  </main>

  <div class="spotlight" id="spotlight" aria-hidden="true" inert>
    <div class="spotlight-scrim" id="spotlight-scrim" aria-hidden="true"></div>
    <section
      class="spotlight-panel"
      id="spotlight-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="spotlight-name"
      aria-describedby="spotlight-description"
      tabindex="-1"
    >
      <button class="spotlight-close" id="spotlight-close" type="button" aria-label="关闭人物档案">
        <span aria-hidden="true"></span>
      </button>

      <div class="spotlight-audio-controls" id="spotlight-audio-controls">
        <button class="spotlight-audio-btn" id="spotlight-audio-btn" type="button" aria-label="暂停朗读" aria-pressed="true">
          <span class="spotlight-audio-icon" id="spotlight-audio-icon" aria-hidden="true">❚❚</span>
          <span class="spotlight-audio-label" id="spotlight-audio-label">暂停</span>
        </button>
        <button class="spotlight-audio-replay" id="spotlight-audio-replay" type="button" aria-label="重新播放人物旁白" title="重新播放">
          <span aria-hidden="true">↺</span>
          <span>重新播放</span>
        </button>
      </div>

      <div class="spotlight-figure" aria-hidden="true">
        <img id="spotlight-image" src="" alt="" width="832" height="1248" draggable="false" decoding="async" />
      </div>

      <div class="spotlight-copy">
        <p class="spotlight-kicker">秦国五君 · 人物档案</p>
        <h2 class="spotlight-name" id="spotlight-name"></h2>
        <p class="spotlight-role" id="spotlight-role"></p>
        <p class="spotlight-era" id="spotlight-era"></p>
        <span class="spotlight-rule" aria-hidden="true"></span>
        <div class="spotlight-story" id="spotlight-story" aria-hidden="true"></div>
        <p class="sr-only" id="spotlight-description"></p>
        <p class="spotlight-meta" id="spotlight-meta"></p>
      </div>

      <div class="spotlight-audio-progress" id="spotlight-audio-progress" aria-hidden="true">
        <span id="spotlight-audio-bar"></span>
      </div>
    </section>
  </div>

  <aside class="hover-detail" id="hover-detail" aria-hidden="true">
    <div class="hover-detail-inner">
      <div class="hover-detail-id">
        <span class="hover-detail-kicker">秦国五君 · 人物档案</span>
        <h2 class="hover-detail-name" id="hover-detail-name"></h2>
        <p class="hover-detail-era" id="hover-detail-era"></p>
      </div>
      <div class="hover-detail-copy">
        <p class="hover-detail-lead">我做的是——</p>
        <p class="hover-detail-merit" id="hover-detail-merit"></p>
        <p class="hover-detail-body" id="hover-detail-body"></p>
      </div>
      <div class="hover-detail-end">
        <span class="hover-detail-meta" id="hover-detail-meta"></span>
        <span class="hover-detail-seal" aria-hidden="true">秦</span>
      </div>
    </div>
  </aside>

  <button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="true" aria-label="关闭背景音乐">
    <span class="sound-toggle-icon" aria-hidden="true">♪</span>
    <span class="sound-toggle-label">背景乐</span>
  </button>

  <audio id="bgm" src="assets/audio/bgm.mp3" loop preload="none"></audio>
  <audio id="spotlight-audio" preload="none"></audio>

  <div class="sr-only" id="live-region" aria-live="polite" aria-atomic="true"></div>

  <noscript>
    <div class="noscript-note">
      <p>这一页需要 JavaScript 才能展开五位秦君的立绘与自述。</p>
      <p>他们分别是：秦非子、秦襄公、秦穆公、秦康公、秦共公。</p>
    </div>
  </noscript>

  <script src="app.js"></script>
</body>
</html>
